<app-header></app-header>

<main class="board-container">
  @if (activeBoard(); as board) {
    <div class="columns-wrapper d-flex gap-4">
      @for (column of board.columns; track $index) {
        <app-column [column]="column" [columnIndex]="$index"></app-column>
      }
    </div>
  } @else {
    <div class="empty-state">
      <p>Loading board...</p>
    </div>
  }
</main>
